name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padel
          POSTGRES_PASSWORD: padel_ci_password
          POSTGRES_DB: padel_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U padel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://padel:padel_ci_password@localhost:5432/padel_tracker?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
    steps:
      # v4 tags pinned to commit SHAs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://padel:unused@localhost:5432/padel_tracker?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build
