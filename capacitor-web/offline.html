<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Padelmaestro</title>
<style>
  :root {
    --bg: #0b1220;
    --text: #e6edf7;
    --muted: #9aa8bd;
    --accent: #06b6d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    min-block-size: 100vh;
    min-block-size: 100dvh;
    display: grid;
    place-items: center;
    padding-block: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-bottom));
    padding-inline: max(24px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-right));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { inline-size: 100%; max-inline-size: 22rem; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; font-weight: 700; }
  p { margin: 0 0 32px; font-size: 1rem; line-height: 1.5; color: var(--muted); }
  button {
    inline-size: 100%;
    min-block-size: 3rem;
    padding: 12px 24px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #04202a;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Keine Verbindung</h1>
  <p>Padelmaestro kann gerade nicht geladen werden. Prüfe deine Internetverbindung und versuche es erneut.</p>
  <button type="button" id="retry">Erneut versuchen</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () {
    location.replace("https://padelmaestro.de");
  });
</script>
</body>
</html>
